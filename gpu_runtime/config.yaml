# ============================================================================
# LLM Evaluator Configuration
# ============================================================================
# This file uses environment variable substitution for sensitive values.
# Set your actual tokens in the .env file in this directory.
#
# Format: ${ENV_VAR_NAME} or ${ENV_VAR_NAME:-default_value}
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# API Keys (loaded from environment variables)
# ----------------------------------------------------------------------------
# HuggingFace token - set HF_TOKEN in .env file
hf_token: "${HF_TOKEN}"

# vLLM API key - set VLLM_API_KEY in .env file
vllm_api_key: "${VLLM_API_KEY:-sk-your-key-eval}"

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------
generation_profile:
  gpu: "a40"
  concurrent_users: 25
  target_max_output_tokens: 512
  seq_lens: "4096,8192,16384"
  allow_fits: "comfortable"
  generated_at: "2026-05-03 15:29:24"
models:
  granite_4_1_8b_fp16_a40:
    name: "granite-4-1-8b-a40"
    repo: "ibm-granite/granite-4.1-8b"
    local_path: "/workspace/models/granite_4_1_8b_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 4096
    usable_input_tokens: 3584
    gpu_memory_util: 0.90

  qwen3_5_35b_a3b_dflash_fp16_a40:
    name: "qwen3-5-35b-a3b-dflash-a40"
    repo: "z-lab/Qwen3.5-35B-A3B-DFlash"
    local_path: "/workspace/models/qwen3_5_35b_a3b_dflash_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    usable_input_tokens: 15872
    gpu_memory_util: 0.90

  qwen3_5_9b_dflash_fp16_a40:
    name: "qwen3-5-9b-dflash-a40"
    repo: "z-lab/Qwen3.5-9B-DFlash"
    local_path: "/workspace/models/qwen3_5_9b_dflash_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    usable_input_tokens: 15872
    gpu_memory_util: 0.90
evaluation:
  # All 24 EU languages
  languages: ["BG", "HR", "CS", "DA", "NL", "EN", "ET", "FI", "FR", "DE", "EL", "HU", "GA", "IT", "LV", "LT", "MT", "PL", "PT", "RO", "SK", "SL", "ES", "SV"]
  num_runs: ${NUM_RUNS:-3}                      # Runs per question
  temperature: ${TEMPERATURE:-0.0}              # Deterministic
  max_tokens: 512


# ----------------------------------------------------------------------------
# vLLM Configuration
# ----------------------------------------------------------------------------
vllm:
  port: ${VLLM_PORT:-8000}
  host: "${VLLM_HOST:-0.0.0.0}"
  timeout: ${VLLM_TIMEOUT:-120}                 # Seconds to wait for startup


# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  models_dir: "${MODELS_DIR:-/workspace/models}"
  results_dir: "${RESULTS_DIR:-/workspace/llm_evaluator/results}"
  cache_dir: "${CACHE_DIR:-/workspace/.cache/huggingface}"
