# ============================================================================
# LLM Evaluator Configuration
# ============================================================================
# This file uses environment variable substitution for sensitive values.
# Set your actual tokens in the .env file in this directory.
#
# Format: ${ENV_VAR_NAME} or ${ENV_VAR_NAME:-default_value}
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# API Keys (loaded from environment variables)
# ----------------------------------------------------------------------------
# HuggingFace token - set HF_TOKEN in .env file
hf_token: "${HF_TOKEN}"

# vLLM API key - set VLLM_API_KEY in .env file
vllm_api_key: "${VLLM_API_KEY:-sk-your-key-eval}"

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------
generation_profile:
  gpu: "a40"
  concurrent_users: 1
  target_max_output_tokens: 512
  image_token_reserve: 1024
  seq_lens: "4096,8192,16384"
  allow_fits: "comfortable,tight"
  generated_at: "2026-05-05 15:24:51"
models:
  granite_vision_4_1_4b_fp16_a40:
    name: "granite-vision-4-1-4b-a40"
    repo: "ibm-granite/granite-vision-4.1-4b"
    local_path: "/workspace/models/granite_vision_4_1_4b_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    usable_input_tokens: 14848
    image_token_reserve: 1024
    gpu_memory_util: 0.90
    trust_remote_code: true
    vllm_extra_args:
      - "--limit-mm-per-prompt"
      - "image=1"

  internvl3_5_14b_fp16_a40:
    name: "internvl3-5-14b-a40"
    repo: "OpenGVLab/InternVL3_5-14B"
    local_path: "/workspace/models/internvl3_5_14b_fp16_a40"
    quant: null
    dtype: "bfloat16"
    max_model_len: 16384
    usable_input_tokens: 14848
    image_token_reserve: 1024
    gpu_memory_util: 0.85
    trust_remote_code: true
    vllm_extra_args:
      - "--limit-mm-per-prompt"
      - "image=1"

  internvl3_5_38b_awq_4bit_fp16_a40:
    name: "internvl3-5-38b-awq-4bit-a40"
    repo: "cyankiwi/InternVL3_5-38B-AWQ-4bit"
    local_path: "/workspace/models/internvl3_5_38b_awq_4bit_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    usable_input_tokens: 14848
    image_token_reserve: 1024
    gpu_memory_util: 0.85
    trust_remote_code: true
    vllm_extra_args:
      - "--limit-mm-per-prompt"
      - "image=1"

  internvl3_5_4b_instruct_fp16_a40:
    name: "internvl3-5-4b-instruct-a40"
    repo: "OpenGVLab/InternVL3_5-4B-Instruct"
    local_path: "/workspace/models/internvl3_5_4b_instruct_fp16_a40"
    quant: null
    dtype: "bfloat16"
    max_model_len: 16384
    usable_input_tokens: 14848
    image_token_reserve: 1024
    gpu_memory_util: 0.90
    trust_remote_code: true
    vllm_extra_args:
      - "--limit-mm-per-prompt"
      - "image=1"

  phi_3_5_vision_instruct_fp16_a40:
    name: "phi-3-5-vision-instruct-a40"
    repo: "microsoft/Phi-3.5-vision-instruct"
    local_path: "/workspace/models/phi_3_5_vision_instruct_fp16_a40"
    quant: null
    dtype: "bfloat16"
    max_model_len: 16384
    usable_input_tokens: 14848
    image_token_reserve: 1024
    gpu_memory_util: 0.90
    trust_remote_code: true

evaluation:
  # All 24 EU languages
  languages: ["BG", "HR", "CS", "DA", "NL", "EN", "ET", "FI", "FR", "DE", "EL", "HU", "GA", "IT", "LV", "LT", "MT", "PL", "PT", "RO", "SK", "SL", "ES", "SV"]
  num_runs: ${NUM_RUNS:-3}                      # Runs per question
  temperature: ${TEMPERATURE:-0.0}              # Deterministic
  max_tokens: 512


# ----------------------------------------------------------------------------
# vLLM Configuration
# ----------------------------------------------------------------------------
vllm:
  port: ${VLLM_PORT:-8000}
  host: "${VLLM_HOST:-0.0.0.0}"
  timeout: ${VLLM_TIMEOUT:-120}                 # Seconds to wait for startup


# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  models_dir: "${MODELS_DIR:-/workspace/models}"
  results_dir: "${RESULTS_DIR:-/workspace/llm_evaluator/results}"
  cache_dir: "${CACHE_DIR:-/workspace/.cache/huggingface}"
