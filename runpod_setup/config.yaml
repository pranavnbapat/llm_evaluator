# ============================================================================
# LLM Evaluator Configuration
# ============================================================================
# Edit this file with your actual tokens before running evaluation

# ----------------------------------------------------------------------------
# API Keys (REQUIRED - fill these in)
# ----------------------------------------------------------------------------
hf_token: ""                    # HuggingFace token for downloading models
vllm_api_key: "sk-runpod-eval"  # Can leave as-is, for securing vLLM endpoint

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------
models:
  eurollm_9b:
    name: "EuroLLM-9B-Instruct"
    repo: "utter-project/EuroLLM-9B-Instruct-2512"
    local_path: "/workspace/models/eurollm_9b"
    quant: null                   # No quantization
    max_model_len: 8192
    gpu_memory_util: 0.75
    
  qwen3_30b_awq:
    name: "Qwen3-30B-A3B-AWQ"
    repo: "Qwen/Qwen3-30B-A3B-Instruct-2507-AWQ"
    local_path: "/workspace/models/qwen3_30b_a3b_awq"
    quant: "awq"                  # AWQ quantization
    max_model_len: 32768
    gpu_memory_util: 0.65
    
  deepseek_14b:
    name: "DeepSeek-R1-14B"
    repo: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
    local_path: "/workspace/models/deepseek_14b"
    quant: null
    max_model_len: 16384
    gpu_memory_util: 0.75
    
  mixtral_8x7b:
    name: "Mixtral-8x7B-Instruct"
    repo: "mistralai/Mixtral-8x7B-Instruct-v0.1"
    local_path: "/workspace/models/mixtral_8x7b"
    quant: null
    max_model_len: 16384
    gpu_memory_util: 0.90
    
  mistral_small_24b:
    name: "Mistral-Small-24B"
    repo: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
    local_path: "/workspace/models/mistral_small_24b"
    quant: null
    max_model_len: 4096           # Reduced for 48GB VRAM
    gpu_memory_util: 0.92

# ----------------------------------------------------------------------------
# Evaluation Configuration
# ----------------------------------------------------------------------------
evaluation:
  languages: ["EN", "DE", "FR", "ES", "IT"]  # EU languages to test
  num_runs: 3                                   # Runs per question
  temperature: 0.0                              # Deterministic
  max_tokens: 2048                              # Max response length

# ----------------------------------------------------------------------------
# vLLM Configuration
# ----------------------------------------------------------------------------
vllm:
  port: 8000
  host: "0.0.0.0"
  timeout: 120                                  # Seconds to wait for startup

# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  models_dir: "/workspace/models"
  results_dir: "/workspace/evaluation_results"
  cache_dir: "/workspace/.cache/huggingface"
