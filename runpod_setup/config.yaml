# ============================================================================
# LLM Evaluator Configuration
# ============================================================================
# This file uses environment variable substitution for sensitive values.
# Set your actual tokens in the .env file in this directory.
#
# Format: ${ENV_VAR_NAME} or ${ENV_VAR_NAME:-default_value}
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# API Keys (loaded from environment variables)
# ----------------------------------------------------------------------------
# HuggingFace token - set HF_TOKEN in .env file
hf_token: "${HF_TOKEN}"

# vLLM API key - set VLLM_API_KEY in .env file (defaults to "sk-runpod-eval")
vllm_api_key: "${VLLM_API_KEY:-sk-runpod-eval}"

# ----------------------------------------------------------------------------
# Model Configuration
# ----------------------------------------------------------------------------
models:
  deepseek_r1_distill_qwen_14b_fp16_a40:
    name: "deepseek-r1-distill-qwen-14b-a40"
    repo: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
    local_path: "/workspace/models/deepseek_r1_distill_qwen_14b_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  deepseek_r1_distill_qwen_7b_fp16_a40:
    name: "deepseek-r1-distill-qwen-7b-a40"
    repo: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    local_path: "/workspace/models/deepseek_r1_distill_qwen_7b_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  eurollm_9b_instruct_2512_fp16_a40:
    name: "eurollm-9b-instruct-2512-a40"
    repo: "utter-project/EuroLLM-9B-Instruct-2512"
    local_path: "/workspace/models/eurollm_9b_instruct_2512_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  mistral_nemo_instruct_2407_fp16_a40:
    name: "mistral-nemo-instruct-2407-a40"
    repo: "mistralai/Mistral-Nemo-Instruct-2407"
    local_path: "/workspace/models/mistral_nemo_instruct_2407_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  mixtral_8x7b_instruct_v0_1_fp16_a40:
    name: "mixtral-8x7b-instruct-v0-1-a40"
    repo: "mistralai/Mixtral-8x7B-Instruct-v0.1"
    local_path: "/workspace/models/mixtral_8x7b_instruct_v0_1_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  qwen3_30b_a3b_instruct_2507_awq_fp16_a40:
    name: "qwen3-30b-a3b-instruct-2507-awq-a40"
    repo: "stelterlab/Qwen3-30B-A3B-Instruct-2507-AWQ"
    local_path: "/workspace/models/qwen3_30b_a3b_instruct_2507_awq_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90

  teuken_7b_instruct_commercial_v0_4_fp16_a40:
    name: "teuken-7b-instruct-commercial-v0-4-a40"
    repo: "openGPT-X/Teuken-7B-instruct-commercial-v0.4"
    local_path: "/workspace/models/teuken_7b_instruct_commercial_v0_4_fp16_a40"
    quant: null
    dtype: "float16"
    max_model_len: 16384
    gpu_memory_util: 0.90
evaluation:
  # All 24 EU languages
  languages: ["BG", "HR", "CS", "DA", "NL", "EN", "ET", "FI", "FR", "DE", "EL", "HU", "GA", "IT", "LV", "LT", "MT", "PL", "PT", "RO", "SK", "SL", "ES", "SV"]
  num_runs: ${NUM_RUNS:-3}                      # Runs per question
  temperature: ${TEMPERATURE:-0.0}              # Deterministic
  max_tokens: ${MAX_TOKENS:-2048}               # Max response length

# ----------------------------------------------------------------------------
# vLLM Configuration
# ----------------------------------------------------------------------------
vllm:
  port: ${VLLM_PORT:-8000}
  host: "${VLLM_HOST:-0.0.0.0}"
  timeout: ${VLLM_TIMEOUT:-120}                 # Seconds to wait for startup

# ----------------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------------
paths:
  models_dir: "${MODELS_DIR:-/workspace/models}"
  results_dir: "${RESULTS_DIR:-/workspace/llm_evaluator/results}"
  cache_dir: "${CACHE_DIR:-/workspace/.cache/huggingface}"
