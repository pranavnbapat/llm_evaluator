# ----------------------------------------------------------------------------
# API Keys (loaded from environment variables)
# ----------------------------------------------------------------------------
# HuggingFace token - set HF_TOKEN in .env file
hf_token: "${HF_TOKEN}"

# vLLM API key - set VLLM_API_KEY in .env file (defaults to "sk-runpod-eval")
vllm_api_key: "${VLLM_API_KEY:-sk-runpod-eval}"

