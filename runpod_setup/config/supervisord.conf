; ============================================================================
; Supervisord configuration for RunPod vLLM Multi-Model Evaluation
; ============================================================================
; This manages TWO services:
;   1. vllm       - The LLM inference server (port 8000)
;   2. evaluator  - The evaluation API service (port 8080)
;
; Usage:
;   Start:   supervisord -c /workspace/ops/supervisord.conf
;   Stop:    supervisorctl -c /workspace/ops/supervisord.conf shutdown
;   Status:  supervisorctl -c /workspace/ops/supervisord.conf status
;   Logs:    supervisorctl -c /workspace/ops/supervisord.conf tail -f vllm
;            supervisorctl -c /workspace/ops/supervisord.conf tail -f evaluator
; ============================================================================

[supervisord]
nodaemon=false
user=root
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/ops/supervisord.pid

[unix_http_server]
file=/workspace/ops/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/ops/supervisor.sock

; ============================================================================
; Service 1: vLLM Inference Server
; ============================================================================
; This service is controlled by switch_model.sh which:
;   1. Stops this service
;   2. Updates /workspace/vllm/current.env
;   3. Starts this service again
;
; The command is a wrapper that reads current.env
; ============================================================================
[program:vllm]
command=/workspace/vllm/scripts/run_vllm.sh
directory=/workspace
environment=HOME="/workspace",HF_HOME="/workspace/.cache/huggingface",VLLM_WORKER_MULTIPROC_METHOD="spawn",PYTHONUNBUFFERED="1",CUDA_VISIBLE_DEVICES="0"
autostart=false
autorestart=false
startsecs=30
startretries=1
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/workspace/vllm/logs/vllm.log
stderr_logfile=/workspace/vllm/logs/vllm.err.log

; ============================================================================
; Service 2: LLM Evaluator API
; ============================================================================
; This service provides the evaluation API on port 8080
; It reads configuration from environment variables set in the .env file
; ============================================================================
[program:evaluator]
command=/workspace/llm_evaluator/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080
directory=/workspace/llm_evaluator
environment=HOME="/workspace",PYTHONUNBUFFERED="1",LOG_LEVEL="INFO"
autostart=false
autorestart=true
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/workspace/logs/evaluator.log
stderr_logfile=/workspace/logs/evaluator.err.log
